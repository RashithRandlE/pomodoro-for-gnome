<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="60%" stop-color="#ee5253"/>
      <stop offset="100%" stop-color="#b33939"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#10ac84"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Tomato Body -->
  <g filter="url(#shadow)">
    <path d="M 64 26
             C 42 26, 20 40, 18 68
             C 16 94, 38 116, 64 116
             C 90 116, 112 94, 110 68
             C 108 40, 86 26, 64 26 Z"
          fill="url(#tomatoGrad)"/>
  </g>

  <!-- Tomato Highlight -->
  <path d="M 36 38 C 44 32, 54 30, 64 30"
        stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Timer Ring / Dial Gauge in Center -->
  <circle cx="64" cy="72" r="26" fill="rgba(0,0,0,0.18)"/>
  <circle cx="64" cy="72" r="22" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none"/>
  <!-- Dial Arc (Pomodoro 25min chunk) -->
  <path d="M 64 50 A 22 22 0 0 1 83 83 L 64 72 Z" fill="rgba(255,255,255,0.85)"/>
  <circle cx="64" cy="72" r="4" fill="#ffffff"/>

  <!-- Stem & Leaves -->
  <path d="M 64 26 C 63 18, 65 12, 69 8 C 70 7, 72 9, 70 12 C 67 17, 66 22, 65 26 Z"
        fill="#576574"/>
  <!-- Leaf Left -->
  <path d="M 64 26 C 52 20, 36 22, 32 26 C 36 32, 50 31, 64 26 Z"
        fill="url(#leafGrad)"/>
  <!-- Leaf Right -->
  <path d="M 64 26 C 76 20, 92 22, 96 26 C 92 32, 78 31, 64 26 Z"
        fill="url(#leafGrad)"/>
  <!-- Leaf Center -->
  <path d="M 64 26 C 60 35, 68 40, 64 45 C 61 40, 59 34, 64 26 Z"
        fill="url(#leafGrad)"/>
</svg>
